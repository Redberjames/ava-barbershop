<style>
:root{
  --bg:#0a0a0b; --bg-1:#111110; --bg-2:#171613; --panel:#1c1a16; --panel-2:#221f19;
  --line: rgba(201,162,76,.22); --line-soft: rgba(201,162,76,.12);
  --gold:#c9a24c; --gold-2:#eecb7a; --gold-dim:#8a713a;
  --ink:#f4ecd8; --ink-dim:#b6ada0; --ink-faint:#7c7568;
  --danger:#c1594a; --success:#6f9b6d;
  --radius-lg:18px; --radius-md:10px;
  --shadow-gold: 0 0 0 1px var(--line), 0 20px 60px -20px rgba(0,0,0,.8);
  --ease: cubic-bezier(.22,.9,.25,1);
  --accent: var(--gold); --accent-2: var(--gold-2);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
::selection{background:var(--gold); color:#100e0a;}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Jost',sans-serif; font-weight:400; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
h1,h2,h3,h4{ font-family:'Bebas Neue',sans-serif; letter-spacing:.03em; margin:0; font-weight:400; }
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
.container{ max-width:900px; margin:0 auto; padding:0 28px; }
.eyebrow{ font-family:'Jost',sans-serif; text-transform:uppercase; letter-spacing:.32em; font-size:11px; color:var(--accent); display:flex; align-items:center; gap:12px; font-weight:600; }
.eyebrow::before{content:''; width:26px; height:1px; background:var(--accent);}
.section-title{ font-size:clamp(34px,6vw,54px); line-height:.98; margin-top:14px; color:var(--ink); }
.section-title em{ font-style:normal; color:var(--accent);}
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:15px 30px; border-radius:2px; border:1px solid var(--accent); background:transparent; color:var(--accent); font-size:13px; letter-spacing:.18em; text-transform:uppercase; font-weight:600; transition:all .35s var(--ease); position:relative; overflow:hidden; }
.btn span{position:relative; z-index:2;}
.btn::before{content:''; position:absolute; inset:0; background:var(--accent); transform:translateY(101%); transition:transform .35s var(--ease); z-index:1;}
.btn:hover::before{transform:translateY(0);}
.btn:hover{color:#100e0a;}
.btn-solid{ background:var(--accent); color:#100e0a; }
.btn-solid::before{ background:var(--accent-2); }
.btn-ghost{ border-color:var(--line); color:var(--ink-dim); }
.btn-ghost::before{ background:var(--line-soft); }
.btn-ghost:hover{ color:var(--ink); }
.empty-state{ text-align:center; padding:60px 20px; color:var(--ink-faint); }

/* ---- nav ---- */
#nav{ position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:18px 28px; background:rgba(10,10,11,.9); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.brand{ display:flex; align-items:center; gap:12px; }
.brand img{ width:38px; height:38px; object-fit:contain; }
.brand .bn{ font-family:'Bebas Neue'; font-size:18px; letter-spacing:.08em; line-height:1; }
#nav a.back{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim); transition:color .25s; }
#nav a.back:hover{ color:var(--accent); }

/* ---- hero / summary ---- */
#topHero{ padding:70px 0 20px; text-align:center; }
.rating-hero{ margin-top:34px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:40px; display:flex; gap:44px; align-items:center; justify-content:center; flex-wrap:wrap; box-shadow:var(--shadow-gold); }
.rating-hero .big{ text-align:center; }
.rating-hero .big .n{ font-family:'Bebas Neue'; font-size:72px; color:var(--accent); line-height:1; }
.rating-hero .big .stars{ color:var(--accent); font-size:20px; letter-spacing:3px; margin-top:6px; }
.rating-hero .big .count{ color:var(--ink-faint); font-size:12.5px; margin-top:8px; letter-spacing:.05em; }
.rating-bars{ display:grid; gap:8px; min-width:240px; flex:1; max-width:320px; }
.rating-bars .row{ display:grid; grid-template-columns:38px 1fr 34px; gap:10px; align-items:center; font-size:12px; color:var(--ink-dim); }
.rating-bars .track{ height:8px; background:var(--bg-2); border-radius:6px; overflow:hidden; border:1px solid var(--line-soft); }
.rating-bars .fill{ height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); }

/* ---- review list ---- */
#reviewsList{ padding:50px 0 100px; }
.rank-row{ display:flex; gap:20px; align-items:flex-start; padding:26px 0; border-bottom:1px solid var(--line-soft); }
.rank-row:first-child{ padding-top:0; }
.rank-num{ font-family:'Bebas Neue'; font-size:30px; color:var(--gold-dim); min-width:44px; }
.rank-row.top .rank-num{ color:var(--accent); }
.rank-body .stars{ color:var(--accent); font-size:14px; letter-spacing:2px; }
.rank-body p{ font-family:'Cormorant Garamond'; font-style:italic; font-size:18px; line-height:1.6; color:var(--ink); margin:10px 0 8px; }
.rank-body .who{ font-size:12px; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase; }

/* ---- footer cta ---- */
#cta{ text-align:center; padding:0 0 90px; }
#cta .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:44px; }
#cta p{ color:var(--ink-dim); margin-top:10px; }
#cta .btn{ margin-top:22px; }

@media(max-width:640px){
  .container{ padding:0 20px; }
  .rating-hero{ padding:28px; gap:26px; }
  .rating-hero .big .n{ font-size:56px; }
  #topHero{ padding:44px 0 10px; }
}
</style>
</head>

<section id="topHero">
  <div class="container">
    <div class="eyebrow" style="justify-content:center;">Word On The Street</div>
    <h2 class="section-title">Top <em>Reviews</em></h2>
    <div class="rating-hero" id="ratingHero"></div>
  </div>
</section>

<section id="reviewsList">
  <div class="container" id="reviewsListInner"></div>
</section>

<section id="cta">
  <div class="container">
    <div class="card">
      <h3 style="font-size:26px;">Had A Great Cut?</h3>
      <p>Leave your own rating and review on the main site — it only takes a minute.</p>
      <a href="index.html#testimonials" class="btn btn-solid"><span>Leave A Review</span></a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const SUPABASE_URL = "https://krabticeyzggwvjngxup.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_aTd-pF0hkzNH5_qnxI29wQ_wVT_l1hh";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDisplayDate(k){
  if(!k) return "";
  const [y,m,d] = k.split("-").map(Number);
  if(!y) return "";
  return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short", day:"numeric", year:"numeric"});
}

async function boot(){
  let name = "Ava Barbershop", logoUrl = "", testimonials = [];
  try{
    const { data, error } = await sb.from("shop_data").select("value").eq("id","main").maybeSingle();
    if(error) throw error;
    if(data && data.value){
      name = (data.value.meta && data.value.meta.name) || name;
      if(data.value.meta && data.value.meta.accent) document.documentElement.style.setProperty("--accent", data.value.meta.accent);
      if(data.value.meta && data.value.meta.accent2) document.documentElement.style.setProperty("--accent-2", data.value.meta.accent2);
      testimonials = (data.value.testimonials||[]).filter(t=>t.approved!==false);
    }
  }catch(e){ console.error("Could not load reviews:", e); }

  document.title = "Client Reviews — " + name;
  document.getElementById("brandName").textContent = name.toUpperCase();

  const total = testimonials.length;
  const ratingHero = document.getElementById("ratingHero");
  if(!total){
    ratingHero.innerHTML = `<div class="empty-state" style="padding:10px 0;">No reviews yet — be the first to leave one.</div>`;
    document.getElementById("reviewsListInner").innerHTML = "";
    return;
  }

  const avg = testimonials.reduce((s,t)=>s+(t.stars||5),0) / total;
  const rounded = Math.round(avg);
  const counts = [5,4,3,2,1].map(n => testimonials.filter(t=>(t.stars||5)===n).length);

  ratingHero.innerHTML = `
    <div class="big">
      <div class="n">${avg.toFixed(1)}</div>
      <div class="stars">${"★".repeat(rounded)}${"☆".repeat(5-rounded)}</div>
      <div class="count">${total} review${total===1?"":"s"}</div>
    </div>
    <div class="rating-bars">
      ${[5,4,3,2,1].map((n,i)=>`
        <div class="row">
          <span>${n} ★</span>
          <div class="track"><div class="fill" style="width:${total? (counts[i]/total*100) : 0}%"></div></div>
          <span>${counts[i]}</span>
        </div>`).join("")}
    </div>`;

  const top10 = testimonials.slice()
    .sort((a,b)=> (b.stars||5)-(a.stars||5) || (b.date||"").localeCompare(a.date||""))
    .slice(0,10);

  document.getElementById("reviewsListInner").innerHTML = top10.map((t,i)=>`
    <div class="rank-row ${i<3?'top':''}">
      <div class="rank-num">${String(i+1).padStart(2,"0")}</div>
      <div class="rank-body">
        <div class="stars">${"★".repeat(t.stars||5)}${"☆".repeat(5-(t.stars||5))}</div>
        <p>"${esc(t.text)}"</p>
        <div class="who">— ${esc(t.name)}${t.date?(' · '+fmtDisplayDate(t.date)):''}</div>
      </div>
    </div>`).join("");
}
boot();
</script>
