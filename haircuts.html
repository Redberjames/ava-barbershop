<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Haircut Styles — AVA BARBERSHOP</title><meta content="Browse haircut styles at Ava Barbershop." name="description"/><style>
:root{--bg:#0a0a0a;--panel:#111;--panel2:#171717;--line:#2a2a2a;--ink:#f5f1e8;--dim:#a9a49b;--gold:#d7b56d;--gold2:#f0d48c}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b1813 0,#0a0a0a 42%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1220px,calc(100% - 36px));margin:auto}.top{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}.nav{height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.16em}.mark{width:36px;height:36px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:13px}.mark-logo{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid rgba(215,181,109,.4);display:block;background:#0e0e0e}.empty-msg{grid-column:1/-1;text-align:center;color:var(--dim);padding:60px 20px;font-size:14px}.brand small{display:block;color:var(--dim);font-size:9px;letter-spacing:.28em;margin-top:3px}.back{padding:10px 15px;border:1px solid var(--line);border-radius:999px;color:var(--dim);font-size:13px}.back:hover{border-color:var(--gold);color:var(--gold)}.hero{padding:74px 0 36px;text-align:center}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.25em;font-size:11px;font-weight:700}h1{font-family:Georgia,serif;font-size:clamp(42px,7vw,82px);line-height:.95;margin:15px 0 18px;font-weight:500}h1 em{color:var(--gold);font-style:italic}.lead{max-width:680px;margin:auto;color:var(--dim);line-height:1.7;font-size:15px}.tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:34px auto 30px}input,.filter{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 15px;outline:none}input{width:min(360px,100%)}input:focus{border-color:var(--gold)}.filter{cursor:pointer}.filter.active{border-color:var(--gold);color:var(--gold);background:#18150f}.count{text-align:center;color:var(--dim);font-size:12px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding-bottom:80px}.cut-card{background:linear-gradient(180deg,#141414,#0e0e0e);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}.cut-card:hover{transform:translateY(-5px);border-color:#65542e;box-shadow:0 20px 50px rgba(0,0,0,.35)}.cut-photo{position:relative;aspect-ratio:4/5;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 30% 18%,#1c1a15 0%,#100f0c 60%,#0a0a0a 100%)}.cut-ghost{position:absolute;right:-4px;bottom:-20px;font-family:Georgia,serif;font-weight:600;font-size:104px;line-height:1;letter-spacing:-.02em;color:var(--gold);opacity:.07;pointer-events:none;user-select:none}.cut-icon-ring{position:absolute;width:52%;aspect-ratio:1;border:1px solid rgba(215,181,109,.22);border-radius:50%;transition:border-color .35s,transform .5s}.cut-icon{position:relative;width:30%;height:30%;color:var(--gold2);opacity:.88;filter:drop-shadow(0 0 16px rgba(215,181,109,.14));transition:transform .5s,opacity .35s}.cut-icon *{fill:none;stroke:currentColor;stroke-width:2.4}.cut-card:hover .cut-icon{transform:scale(1.1) translateY(-2px);opacity:1}.cut-card:hover .cut-icon-ring{border-color:rgba(215,181,109,.45);transform:scale(1.05)}.cut-num{position:absolute;z-index:3;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(8,8,8,.8);border:1px solid rgba(215,181,109,.75);color:var(--gold2);font-weight:800;font-size:12px;backdrop-filter:blur(8px)}.cut-photo img.cut-real-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cut-photo.has-photo .cut-ghost,.cut-photo.has-photo .cut-icon-ring,.cut-photo.has-photo .cut-icon{opacity:0}
.cut-photo.has-photo{cursor:zoom-in}
.cut-photo .zoom-hint{position:absolute;z-index:2;left:12px;top:12px;width:32px;height:32px;border-radius:50%;background:rgba(8,8,8,.55);border:1px solid rgba(255,255,255,.14);color:var(--ink);display:grid;place-items:center;opacity:0;transform:scale(.85);transition:opacity .25s,transform .25s;backdrop-filter:blur(6px)}
.cut-photo .zoom-hint svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.cut-card:hover .zoom-hint{opacity:1;transform:scale(1)}
.cut-photo img.cut-real-photo{transition:transform .5s ease}
.cut-card:hover .cut-photo.has-photo img.cut-real-photo{transform:scale(1.045)}
.cut-info{padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cut-info .cut-info-text{min-width:0}
.cut-cat{color:var(--gold);font-size:9px;text-transform:uppercase;letter-spacing:.18em;margin-bottom:7px}
.cut-info h3{font-family:Georgia,serif;font-size:20px;margin:0;font-weight:500;line-height:1.15}
.cut-num-inline{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(215,181,109,.08);border:1px solid rgba(215,181,109,.55);color:var(--gold2);font-weight:800;font-size:11px;letter-spacing:.02em}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--dim);font-size:12px;text-align:center}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.nav{height:68px}.brand span{display:none}.hero{padding-top:54px}.cut-info{padding:13px}.cut-info h3{font-size:17px}.cut-num-inline{width:29px;height:29px;font-size:10px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.cut-photo{aspect-ratio:1/1.08}}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(6,6,6,.94);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox-stage{position:relative;width:min(760px,92vw);max-height:88vh;display:flex;flex-direction:column;align-items:center}
.lightbox-frame{position:relative;width:100%;flex:1;min-height:0;border-radius:16px;overflow:hidden;border:1px solid rgba(215,181,109,.28);background:#0e0e0e;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.lightbox-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0a0a0a;opacity:0;transition:opacity .25s}
.lightbox-frame img.show{opacity:1}
.lightbox-cap{margin-top:16px;text-align:center}
.lightbox-cap .lc-cat{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.22em;margin-bottom:6px}
.lightbox-cap h4{font-family:Georgia,serif;font-weight:500;font-size:24px;margin:0;display:flex;align-items:center;justify-content:center;gap:12px}
.lb-btn{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(20,20,20,.7);border:1px solid rgba(255,255,255,.16);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:border-color .2s,color .2s,transform .2s;backdrop-filter:blur(8px)}
.lb-btn:hover{border-color:var(--gold);color:var(--gold);transform:scale(1.06)}
.lb-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lb-close{top:-58px;right:0}
.lb-prev{left:-58px;top:calc(50% - 23px)}
.lb-next{right:-58px;top:calc(50% - 23px)}
@media(max-width:700px){.lb-close{top:auto;bottom:calc(100% + 68px);right:0}.lb-prev{left:4px;top:calc(50% - 23px)}.lb-next{right:4px;top:calc(50% - 23px)}}
.lightbox-counter{margin-top:10px;color:var(--dim);font-size:12px;letter-spacing:.05em}
</style>

<footer>AVA BARBERSHOP · Haircut Style Library</footer><script>
const SUPABASE_URL="https://krabticeyzggwvjngxup.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_aTd-pF0hkzNH5_qnxI29wQ_wVT_l1hh";
const ICON_MAP={
  "taper & fade":"icon-taper-fade",
  "crop & fringe":"icon-crop-fringe",
  "quiff & pompadour":"icon-quiff-pompadour",
  "slick / comb / part":"icon-slick-comb-part",
  "korean / asian":"icon-korean-asian",
  "mullet / wolf":"icon-mullet-wolf"
};
function iconFor(name){ return ICON_MAP[(name||"").toLowerCase()] || "icon-generic"; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const grid=document.getElementById("grid"), count=document.getElementById("count"), search=document.getElementById("search"), tools=document.getElementById("tools");
let filter="All";

function render(){
  const q=search.value.trim().toLowerCase();
  let n=0;
  grid.querySelectorAll(".cut-card").forEach(c=>{
    const ok=(filter==="All"||c.dataset.cat===filter)&&(!q||c.dataset.name.includes(q));
    c.style.display=ok?"":"none";
    if(ok)n++;
  });
  count.textContent=n+" style"+(n===1?"":"s")+" shown";
}

function buildFilters(categoryNames){
  categoryNames.forEach(name=>{
    const b=document.createElement("button");
    b.className="filter"; b.dataset.filter=name; b.textContent=name;
    tools.appendChild(b);
  });
  tools.querySelectorAll(".filter").forEach(b=>{
    b.addEventListener("click",()=>{
      tools.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
      b.classList.add("active"); filter=b.dataset.filter; render();
    });
  });
}

function buildCards(styles){
  grid.innerHTML = styles.map((s,i)=>{
    const num=String(i+1).padStart(2,"0");
    const icon=iconFor(s.categoryName);
    const photo = s.image ? `<img class="cut-real-photo" loading="lazy" alt="${esc(s.name)}" src="${esc(s.image)}"/>` : "";
    const zoomHint = s.image ? `<span aria-hidden="true" class="zoom-hint"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><line x1="16" y1="16" x2="21" y2="21"/><line x1="11" y1="8.5" x2="11" y2="13.5"/><line x1="8.5" y1="11" x2="13.5" y2="11"/></svg></span>` : "";
    return `<article class="cut-card" data-cat="${esc(s.categoryName)}" data-name="${esc(s.name.toLowerCase())}" data-index="${i}">
      <div class="cut-photo${s.image?" has-photo":""}"${s.image?` role="button" tabindex="0" aria-label="Zoom ${esc(s.name)} photo" data-open-lightbox="${i}"`:""}>
        <span aria-hidden="true" class="cut-ghost">${num}</span>
        <span aria-hidden="true" class="cut-icon-ring"></span>
        <svg aria-hidden="true" class="cut-icon"><use href="#${icon}"></use></svg>
        <span class="cut-num">${num}</span>
        ${zoomHint}
        ${photo}
      </div>
      <div class="cut-info">
        <div class="cut-info-text"><div class="cut-cat">${esc(s.categoryName)}</div><h3>${esc(s.name)}</h3></div>
        <span class="cut-num-inline" aria-hidden="true">${num}</span>
      </div>
    </article>`;
  }).join("");
}

let ALL_STYLES=[];

/* ---- Lightbox ---- */
const lb=document.getElementById("lightbox"), lbImg=document.getElementById("lbImg"),
      lbCat=document.getElementById("lbCat"), lbNameText=document.getElementById("lbNameText"),
      lbNum=document.getElementById("lbNum"), lbCounter=document.getElementById("lbCounter"),
      lbPrev=document.getElementById("lbPrev"), lbNext=document.getElementById("lbNext"), lbClose=document.getElementById("lbClose");
let lbIndices=[], lbPos=0;

function visiblePhotoIndices(){
  const q=search.value.trim().toLowerCase();
  const idxs=[];
  grid.querySelectorAll(".cut-card").forEach(c=>{
    if(c.style.display==="none") return;
    const i=Number(c.dataset.index);
    if(ALL_STYLES[i] && ALL_STYLES[i].image) idxs.push(i);
  });
  return idxs;
}

function openLightbox(index){
  lbIndices = visiblePhotoIndices();
  lbPos = lbIndices.indexOf(index);
  if(lbPos===-1){ lbIndices=[index]; lbPos=0; }
  renderLightbox();
  lb.classList.add("open"); lb.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
}
function closeLightbox(){
  lb.classList.remove("open"); lb.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
}
function renderLightbox(){
  const i=lbIndices[lbPos]; const s=ALL_STYLES[i];
  if(!s) return;
  lbImg.classList.remove("show");
  const img=new Image();
  img.onload=()=>{ lbImg.src=s.image; requestAnimationFrame(()=>lbImg.classList.add("show")); };
  img.src=s.image;
  lbImg.alt=s.name;
  lbCat.textContent=s.categoryName;
  lbNameText.textContent=s.name;
  lbNum.textContent=String(i+1).padStart(2,"0");
  lbCounter.textContent = lbIndices.length>1 ? `${lbPos+1} of ${lbIndices.length}` : "";
  const multi = lbIndices.length>1;
  lbPrev.style.display = multi?"grid":"none";
  lbNext.style.display = multi?"grid":"none";
}
lbPrev.addEventListener("click",()=>{ lbPos=(lbPos-1+lbIndices.length)%lbIndices.length; renderLightbox(); });
lbNext.addEventListener("click",()=>{ lbPos=(lbPos+1)%lbIndices.length; renderLightbox(); });
lbClose.addEventListener("click", closeLightbox);
lb.addEventListener("click",(e)=>{ if(e.target===lb) closeLightbox(); });
document.addEventListener("keydown",(e)=>{
  if(!lb.classList.contains("open")) return;
  if(e.key==="Escape") closeLightbox();
  else if(e.key==="ArrowLeft") lbPrev.click();
  else if(e.key==="ArrowRight") lbNext.click();
});
grid.addEventListener("click",(e)=>{
  const trigger=e.target.closest("[data-open-lightbox]");
  if(trigger) openLightbox(Number(trigger.dataset.openLightbox));
});
grid.addEventListener("keydown",(e)=>{
  if(e.key!=="Enter" && e.key!==" ") return;
  const trigger=e.target.closest("[data-open-lightbox]");
  if(trigger){ e.preventDefault(); openLightbox(Number(trigger.dataset.openLightbox)); }
});

(async function init(){
  try{
    const sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const {data,error}=await sb.from("shop_data").select("value").eq("id","main").maybeSingle();
    if(error) throw error;
    const val=(data&&data.value)||{};
    const categories=Array.isArray(val.haircutCategories)?val.haircutCategories:[];
    const catalog=Array.isArray(val.haircutCatalog)?val.haircutCatalog:[];
    const catNameById={};
    categories.forEach(c=>{ catNameById[c.id]=c.name; });
    const styles=catalog.map(h=>({ name:h.name, image:h.image||"", categoryName: catNameById[h.categoryId] || "Uncategorized" }));
    ALL_STYLES = styles;
    const usedCatNames = categories.map(c=>c.name).filter(name=> styles.some(s=>s.categoryName===name));
    if(styles.some(s=>s.categoryName==="Uncategorized")) usedCatNames.push("Uncategorized");
    buildFilters(usedCatNames);
    buildCards(styles);
    render();
    if(!styles.length){ grid.innerHTML = `<div class="empty-msg">No haircut styles yet — check back soon.</div>`; count.textContent=""; }
  }catch(e){
    console.error("Could not load haircut styles", e);
    grid.innerHTML = `<div class="empty-msg">Couldn't load the style library right now. Please try again shortly.</div>`;
    count.textContent="";
  }
})();

search.addEventListener("input", render);
</script></body></html>
